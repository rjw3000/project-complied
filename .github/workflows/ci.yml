name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository and approval checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_repository.py
      - name: Validate deployment configuration with synthetic placeholders
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - run: python -m unittest discover -s tests -v
      - name: Smoke test synthetic database and dashboard rendering
        run: |
          PYTHONPATH=src python -m complied.deadlines seed --db /tmp/complied-demo.sqlite3
          PYTHONPATH=src python -m complied.recurrence --db /tmp/complied-demo.sqlite3
          PYTHONPATH=src python -m complied.recurrence --db /tmp/complied-demo.sqlite3
          PYTHONPATH=src python -m complied.deadlines list --db /tmp/complied-demo.sqlite3 --today 2026-10-05
          PYTHONPATH=src python -c "from complied.deadlines import connect,dashboard; from complied.web import render; from datetime import date; db=connect('/tmp/complied-demo.sqlite3'); assert 'Synthetic demo only' in render(dashboard(db,date(2026,10,5)),date(2026,10,5)); db.close()"
